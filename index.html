<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dfe9f5">
<title>跳一跳 MVP</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#dfe9f5;}
  body{
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    touch-action:none;
    overscroll-behavior:none;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  /* ===================== 0. 可调参数（手感都在这里改） ===================== */
  var DESIGN_W   = 375;    // 逻辑设计宽度，所有坐标基于它，按屏宽自动缩放
  var CHARGE_MS  = 900;    // 蓄满力所需毫秒数
  var MIN_DIST   = 45;     // 轻点一下的跳跃距离（逻辑像素）
  var MAX_DIST   = 240;    // 蓄满力的跳跃距离
  var TOL        = 4;      // 落点宽容度
  var GROUND_Y   = 0.62;   // 地面线在屏幕高度中的比例
  var CAM_ANCHOR = 0.32;   // 当前方块中心固定在屏宽的百分比位置
  var CAM_SPEED  = 8;      // 镜头跟随速度（越大越跟手）
  var PALETTE    = ['#5b8ff9','#61ddaa','#f6bd16','#ff9d4d','#7262fd','#78d3f8','#f08bb4'];

  /* ===================== 0.5 角色素材 ===================== */
  var SPRITE_SRC  = 'assets/kangaroo.png';  // 3 帧竖排精灵图，每帧 256x256
  var PLAYER_H    = 60;                     // 角色绘制高度（逻辑像素）
  var PLAYER_POSE = 0;                      // 0=侧前3/4  1=背面  2=正面（换一个数字即可试）
  var ART_FACES_LEFT = true;                // 0 号帧脸朝左，往右跳时自动镜像；若朝向反了把这里改成 false
  var CELL        = 256;                    // 单帧像素尺寸

  var sprite = new Image();
  var spriteReady = false;
  sprite.onload  = function () { spriteReady = true; };
  sprite.onerror = function () { spriteReady = false; console.warn('角色素材加载失败，先用几何小人占位'); };
  // 单文件版（dist/jump.html 底部注入了 window.__SPRITE_B64）优先用内嵌 base64，否则读同目录图片
  function bootSprite() {
    sprite.src = window.__SPRITE_B64
      ? 'data:image/png;base64,' + window.__SPRITE_B64
      : SPRITE_SRC;
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootSprite);
  } else {
    bootSprite();
  }

  /* ===================== 1. 画布与坐标系统 ===================== */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scale = 1, viewW = DESIGN_W, viewH = 667, groundY = 400;

  function resize() {
    var w = canvas.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale   = canvas.width / DESIGN_W;   // 逻辑单位 -> 物理像素
    viewW   = DESIGN_W;
    viewH   = canvas.height / scale;
    groundY = viewH * GROUND_Y;
    updateCamTarget();
    G.camX = G.camTargetX;               // 尺寸变化时镜头立即归位
  }

  /* ===================== 2. 游戏状态 ===================== */
  var G = {
    state: 'ready',          // ready | charging | jumping | over
    score: 0,
    boxes: [],               // [{x:左边缘, w:宽, color}]
    player: { x: 0, arc: 0, rot: 0, squash: 0, fall: 0, fallV: 0, face: 1 },
    camX: 0, camTargetX: 0,
    chargeStart: 0, power: 0, jump: null, overAt: 0
  };
  var time = performance.now() / 1000, lastT = 0;

  function pickColor() { return PALETTE[(Math.random() * PALETTE.length) | 0]; }

  function makeBox(prev) {
    var w = 44 + Math.random() * 46;      // 44 ~ 90
    var gap = 55 + Math.random() * 65;    // 55 ~ 120
    return { x: prev ? prev.x + prev.w + gap : 0, w: w, color: pickColor() };
  }

  function updateCamTarget() {
    var cur = G.boxes[0];
    if (!cur) return;
    G.camTargetX = (cur.x + cur.w / 2) - viewW * CAM_ANCHOR;
  }

  function reset() {
    G.score = 0;
    G.state = 'ready';
    G.power = 0;
    G.jump = null;
    G.player.arc = 0; G.player.rot = 0; G.player.squash = 0;
    G.player.fall = 0; G.player.fallV = 0; G.player.face = 1;
    var first = { x: 0, w: 70, color: pickColor() };
    G.boxes = [first, makeBox(first)];
    G.player.x = first.x + first.w / 2;
    updateCamTarget();
    G.camX = G.camTargetX;
  }

  /* ===================== 3. 玩法逻辑 ===================== */
  function onLand() {
    var p = G.player;
    p.arc = 0; p.rot = 0; p.squash = 0;
    var cur = G.boxes[0], nxt = G.boxes[1], x = p.x;
    var onNext = (x >= nxt.x - TOL) && (x <= nxt.x + nxt.w + TOL);
    var onCur  = (x >= cur.x - TOL) && (x <= cur.x + cur.w + TOL);

    if (onNext) {                       // 成功：加 1 分，推进一个新方块
      G.score++;
      G.boxes.shift();
      G.boxes.push(makeBox(G.boxes[G.boxes.length - 1]));
      G.state = 'ready';
      updateCamTarget();
    } else if (onCur) {                 // 原地小跳：不失败也不加分
      G.state = 'ready';
    } else {                            // 落空：游戏结束
      G.state = 'over';
      G.overAt = time;
      p.fallV = 0;
    }
  }

  function update(dt) {
    var p = G.player;

    if (G.state === 'charging') {
      G.power = Math.min((time - G.chargeStart) / (CHARGE_MS / 1000), 1);
      p.squash = G.power;
    }

    if (G.state === 'jumping') {
      var j = G.jump;
      j.t += dt;
      var k = Math.min(j.t / j.dur, 1);
      p.x   = j.fromX + (j.toX - j.fromX) * k;
      p.arc = 4 * j.height * k * (1 - k);   // 抛物线高度
      p.rot = k * Math.PI * 2;              // 空中翻一圈
      if (k >= 1) onLand();
    }

    if (G.state === 'over') {
      p.fallV += 2400 * dt;
      p.fall  += p.fallV * dt;
      p.rot   += dt * 4;
    }

    G.camX += (G.camTargetX - G.camX) * (1 - Math.exp(-CAM_SPEED * dt));
  }

  /* ===================== 4. 渲染 ===================== */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawBoxes() {
    var bodyH = viewH - groundY + 80;   // 向下延伸出屏幕
    for (var i = 0; i < G.boxes.length; i++) {
      var b = G.boxes[i], sx = b.x - G.camX;
      if (sx > viewW + 20 || sx + b.w < -20) continue;
      ctx.fillStyle = b.color;
      roundRect(sx, groundY, b.w, bodyH, 10);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';   // 顶面提亮，制造 2.5D
      roundRect(sx, groundY, b.w, 11, 6);
      ctx.fill();
    }
  }

  function drawPlayer() {
    var p = G.player;
    var sx = p.x - G.camX;
    var sy = groundY - p.arc + p.fall;

    var shadow = Math.max(0, 1 - p.arc / 130 - p.fall / 200);   // 落点参考
    if (shadow > 0.02) {
      ctx.fillStyle = 'rgba(43,58,85,' + (0.18 * shadow) + ')';
      ctx.beginPath();
      ctx.ellipse(sx, groundY + 3, 15 * (0.6 + 0.4 * shadow), 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.translate(0, -PLAYER_H / 2); ctx.rotate(p.rot); ctx.translate(0, PLAYER_H / 2);  // 绕身体中部翻滚
    var fx = (p.face < 0 ? -1 : 1) * (ART_FACES_LEFT ? -1 : 1);                          // 朝跳跃方向（镜像）
    ctx.scale(fx * (1 + 0.22 * p.squash), 1 - 0.35 * p.squash);                          // 蓄力压扁

    if (spriteReady) {
      // 单帧 256x256，人物水平居中、底部对齐，所以整帧画成方形即可
      ctx.drawImage(sprite, 0, PLAYER_POSE * CELL, CELL, CELL,
                    -PLAYER_H / 2, -PLAYER_H, PLAYER_H, PLAYER_H);
    } else {                                                    // 素材没加载出来时的几何占位
      ctx.fillStyle = '#2b3a55';
      roundRect(-9, -18, 18, 18, 6);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -24, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(43,58,85,0.55)';
    ctx.font = '12px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillText('SCORE', 24, 26);
    ctx.fillStyle = '#2b3a55';
    ctx.font = 'bold 34px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillText(String(G.score), 22, 44);

    if (G.state === 'charging') {                 // 蓄力条
      var bw = 160, bh = 8, bx = (viewW - bw) / 2, by = viewH - 64;
      ctx.fillStyle = 'rgba(43,58,85,0.15)';
      roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.fillStyle = '#5b8ff9';
      roundRect(bx, by, Math.max(bh, bw * G.power), bh, bh / 2); ctx.fill();
    }

    if (G.state === 'ready' && G.score === 0) {   // 新手提示
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(43,58,85,0.5)';
      ctx.font = '15px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('长按蓄力，松开起跳', viewW / 2, groundY - 84);
    }

    if (G.state === 'over') {
      ctx.fillStyle = 'rgba(20,30,45,0.35)';
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('游戏结束', viewW / 2, viewH * 0.34);
      ctx.font = 'bold 46px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText(String(G.score), viewW / 2, viewH * 0.43);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '14px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('点击屏幕重新开始', viewW / 2, viewH * 0.52);
    }
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, viewH);
    g.addColorStop(0, '#e8f1fb');
    g.addColorStop(1, '#c9dcf0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);
    drawBoxes();
    drawPlayer();
    drawHUD();
  }

  /* ===================== 5. 输入 ===================== */
  function onDown() {
    if (G.state === 'over') {
      if (time - G.overAt < 0.4) return;   // 防止失败瞬间误触重开
      reset(); return;
    }
    if (G.state === 'ready') {
      G.state = 'charging';
      G.chargeStart = time;
      G.power = 0;
    }
  }

  function onUp() {
    if (G.state !== 'charging') return;
    var pw = G.power;
    var dist = MIN_DIST + pw * (MAX_DIST - MIN_DIST);
    G.player.face = dist >= 0 ? 1 : -1;   // 脸朝跳跃方向
    G.jump = {
      fromX: G.player.x,
      toX: G.player.x + dist,
      t: 0,
      dur: 0.26 + pw * 0.34,
      height: 45 + pw * 75
    };
    G.player.squash = 0;
    G.state = 'jumping';
  }

  function onCancel() {
    if (G.state === 'charging') { G.state = 'ready'; G.power = 0; G.player.squash = 0; }
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); onDown(); });
    window.addEventListener('pointerup',     function (e) { e.preventDefault(); onUp(); });
    window.addEventListener('pointercancel', function (e) { e.preventDefault(); onCancel(); });
  } else {
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); onDown(); }, { passive: false });
    window.addEventListener('touchend',   function (e) { e.preventDefault(); onUp(); },   { passive: false });
    window.addEventListener('touchcancel', function (e) { e.preventDefault(); onCancel(); }, { passive: false });
    canvas.addEventListener('mousedown',  function (e) { e.preventDefault(); onDown(); });
    window.addEventListener('mouseup', function () { onUp(); });
  }
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('blur', onCancel);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ===================== 6. 主循环 ===================== */
  function frame(ts) {
    if (!lastT) lastT = ts;
    var dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;
    time = ts / 1000;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  resize();
  requestAnimationFrame(frame);
})();
</script>
