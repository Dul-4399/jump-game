<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dfe9f5">
<title>跳一跳 MVP</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#dfe9f5;}
  body{
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    touch-action:none;
    overscroll-behavior:none;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  #game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;}
  #mute{
    position:fixed;top:12px;right:12px;width:42px;height:42px;z-index:2;
    border:0;border-radius:50%;background:rgba(74,58,0,0.13);color:#4a3a00;
    font-size:19px;line-height:42px;padding:0;text-align:center;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  #mute.off{opacity:.4;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" type="button" aria-label="音效开关">🔊</button>
<script>
(function () {
  'use strict';

  /* ===================== 0. 可调参数（手感都在这里改） ===================== */
  var DESIGN_W   = 375;    // 逻辑设计宽度，所有坐标基于它，按屏宽自动缩放
  var CHARGE_MS  = 900;    // 蓄满力所需毫秒数
  var MIN_DIST   = 45;     // 轻点一下的跳跃距离（逻辑像素）
  var MAX_DIST   = 240;    // 蓄满力的跳跃距离
  var TOL        = 4;      // 落点宽容度
  var GROUND_Y   = 0.62;   // 地面线在屏幕高度中的比例
  var CAM_ANCHOR = 0.32;   // 当前方块中心固定在屏宽的百分比位置
  var CAM_SPEED  = 8;      // 镜头跟随速度（越大越跟手）
  var PERFECT_TOL   = 8;   // 落点距方块中心多少像素内算「完美居中」
  var PERFECT_BONUS = 2;   // 完美居中得分（普通落地 1 分）

  /* ---- 柠檬黄主题（想换色调只改这 3 行） ---- */
  var BG_TOP  = '#fffbe6';   // 背景渐变 上
  var BG_BOT  = '#ffd83d';   // 背景渐变 下
  var INK     = '#4a3a00';   // 文字/描边色
  var OUTLINE = 'rgba(120,72,0,0.92)';  // 袋鼠描边色（黄底黄角色，全靠它撑对比度）
  // 方块配色刻意避开黄色系：否则会和柠檬黄背景 + 黄袋鼠糊成一片
  var PALETTE = ['#5b8ff9','#61ddaa','#7262fd','#78d3f8','#f08bb4','#3fb6a8'];

  /* ===================== 0.5 角色素材 ===================== */
  var SPRITE_SRC  = 'assets/kangaroo.png';  // 3 帧竖排精灵图，每帧 256x256
  var PLAYER_H    = 60;                     // 角色绘制高度（逻辑像素）
  var PLAYER_POSE = 0;                      // 0=侧前3/4  1=背面  2=正面（换一个数字即可试）
  var ART_FACES_LEFT = true;                // 0 号帧脸朝左，往右跳时自动镜像；若朝向反了把这里改成 false
  var CELL        = 256;                    // 单帧像素尺寸

  var sprite = new Image();
  var spriteReady = false;
  sprite.onload  = function () { spriteReady = true; };
  sprite.onerror = function () { spriteReady = false; console.warn('角色素材加载失败，先用几何小人占位'); };
  // 单文件版（dist/jump.html 底部注入了 window.__SPRITE_B64）优先用内嵌 base64，否则读同目录图片
  function bootSprite() {
    sprite.src = window.__SPRITE_B64
      ? 'data:image/png;base64,' + window.__SPRITE_B64
      : SPRITE_SRC;
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootSprite);
  } else {
    bootSprite();
  }

  /* ===================== 0.6 音效（WebAudio，无外部库） ===================== */
  var SFX_NAMES = ['charge', 'perfect', 'fail'];            // assets/sfx/<name>.wav
  var SFX_VOL   = { charge: 0.45, perfect: 0.9, fail: 0.8 };
  var audioCtx = null, sfxBuf = {}, chargeHandle = null;
  var muted = false;
  try { muted = localStorage.getItem('jump_muted') === '1'; } catch (e) {}

  function b64ToBuf(b64) {
    var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return u8.buffer;
  }

  // 必须在「用户手势」里第一次调用，否则 iOS 不给声音
  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    SFX_NAMES.forEach(loadSfx);
  }

  function loadSfx(name) {
    var inline = window.__SFX_B64 && window.__SFX_B64[name];
    if (inline) { decodeSfx(name, b64ToBuf(inline)); return; }
    fetch('assets/sfx/' + name + '.wav')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(function (b) { decodeSfx(name, b); })
      .catch(function () { /* 素材还没做出来：静默跳过，不影响游戏 */ });
  }

  function decodeSfx(name, buf) {
    audioCtx.decodeAudioData(buf,
      function (ab) { sfxBuf[name] = ab; },
      function () { console.warn('音效解码失败: ' + name); });
  }

  function playSfx(name, loop) {
    if (muted || !audioCtx || !sfxBuf[name]) return null;
    var src = audioCtx.createBufferSource(), g = audioCtx.createGain();
    src.buffer = sfxBuf[name];
    src.loop = !!loop;
    g.gain.value = SFX_VOL[name] || 1;
    src.connect(g); g.connect(audioCtx.destination);
    src.start();
    return { src: src, gain: g };
  }

  function stopSfx(h, fade) {
    if (!h || !audioCtx) return;
    try {
      fade = fade || 0.07;
      var t = audioCtx.currentTime;
      h.gain.gain.setValueAtTime(h.gain.gain.value, t);
      h.gain.gain.linearRampToValueAtTime(0.0001, t + fade);
      h.src.stop(t + fade + 0.02);
    } catch (e) {}
  }

  /* ---- 普通起跳/落地音：代码合成，零素材、零体积 ---- */
  var SYNTH_VOL = { jump: 0.30, land: 0.36 };
  var noiseBuf = null;

  function getNoise() {
    if (noiseBuf || !audioCtx) return noiseBuf;
    var n = Math.floor(audioCtx.sampleRate * 0.4);
    noiseBuf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  // 一个「滑音」：type 波形, f0→f1 扫频, dur 秒
  function tone(type, f0, f1, dur, vol) {
    if (muted || !audioCtx) return;
    try {
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur + 0.03);
    } catch (e) {}
  }

  // 一小撮带通噪声：给滑音加"质地"
  function noiseHit(dur, freq, vol, q) {
    if (muted || !audioCtx) return;
    try {
      var buf = getNoise(); if (!buf) return;
      var t = audioCtx.currentTime;
      var src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
      src.buffer = buf;
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(audioCtx.destination);
      src.start(t); src.stop(t + dur + 0.03);
    } catch (e) {}
  }

  function playJump() {   // 起跳：向上滑音 + 一点风声
    tone('triangle', 240, 820, 0.15, SYNTH_VOL.jump);
    noiseHit(0.09, 1400, 0.09, 0.8);
  }

  function playLand() {   // 落地：向下滑音 + 闷响
    tone('sine', 230, 95, 0.13, SYNTH_VOL.land);
    noiseHit(0.05, 700, 0.12, 1.2);
  }

  /* ===================== 1. 画布与坐标系统 ===================== */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scale = 1, viewW = DESIGN_W, viewH = 667, groundY = 400;

  function resize() {
    var w = canvas.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale   = canvas.width / DESIGN_W;   // 逻辑单位 -> 物理像素
    viewW   = DESIGN_W;
    viewH   = canvas.height / scale;
    groundY = viewH * GROUND_Y;
    updateCamTarget();
    G.camX = G.camTargetX;               // 尺寸变化时镜头立即归位
  }

  /* ===================== 2. 游戏状态 ===================== */
  var G = {
    state: 'ready',          // ready | charging | jumping | over
    score: 0,
    boxes: [],               // [{x:左边缘, w:宽, color}]
    player: { x: 0, arc: 0, rot: 0, squash: 0, fall: 0, fallV: 0, face: 1 },
    camX: 0, camTargetX: 0,
    chargeStart: 0, power: 0, jump: null, overAt: 0
  };
  var popup = { t: 99 };     // 「完美 +2」飘字计时器
  var time = performance.now() / 1000, lastT = 0;

  function pickColor() { return PALETTE[(Math.random() * PALETTE.length) | 0]; }

  function makeBox(prev) {
    var w = 44 + Math.random() * 46;      // 44 ~ 90
    var gap = 55 + Math.random() * 65;    // 55 ~ 120
    return { x: prev ? prev.x + prev.w + gap : 0, w: w, color: pickColor() };
  }

  function updateCamTarget() {
    var cur = G.boxes[0];
    if (!cur) return;
    G.camTargetX = (cur.x + cur.w / 2) - viewW * CAM_ANCHOR;
  }

  function reset() {
    G.score = 0;
    G.state = 'ready';
    G.power = 0;
    G.jump = null;
    G.player.arc = 0; G.player.rot = 0; G.player.squash = 0;
    G.player.fall = 0; G.player.fallV = 0; G.player.face = 1;
    popup.t = 99;
    stopSfx(chargeHandle); chargeHandle = null;
    var first = { x: 0, w: 70, color: pickColor() };
    G.boxes = [first, makeBox(first)];
    G.player.x = first.x + first.w / 2;
    updateCamTarget();
    G.camX = G.camTargetX;
  }

  /* ===================== 3. 玩法逻辑 ===================== */
  function onLand() {
    var p = G.player;
    p.arc = 0; p.rot = 0; p.squash = 0;
    var cur = G.boxes[0], nxt = G.boxes[1], x = p.x;
    var onNext = (x >= nxt.x - TOL) && (x <= nxt.x + nxt.w + TOL);
    var onCur  = (x >= cur.x - TOL) && (x <= cur.x + cur.w + TOL);

    if (onNext) {                       // 成功：推进一个新方块
      playLand();
      var center = nxt.x + nxt.w / 2;
      var perfect = Math.abs(x - center) <= PERFECT_TOL;
      G.score += perfect ? PERFECT_BONUS : 1;
      if (perfect) { popup.t = 0; playSfx('perfect'); }
      G.boxes.shift();
      G.boxes.push(makeBox(G.boxes[G.boxes.length - 1]));
      G.state = 'ready';
      updateCamTarget();
    } else if (onCur) {                 // 原地小跳：不失败也不加分
      playLand();
      G.state = 'ready';
    } else {                            // 落空：游戏结束
      G.state = 'over';
      G.overAt = time;
      p.fallV = 0;
      playSfx('fail');
    }
  }

  function update(dt) {
    var p = G.player;
    popup.t += dt;

    if (G.state === 'charging') {
      G.power = Math.min((time - G.chargeStart) / (CHARGE_MS / 1000), 1);
      p.squash = G.power;
    }

    if (G.state === 'jumping') {
      var j = G.jump;
      j.t += dt;
      var k = Math.min(j.t / j.dur, 1);
      p.x   = j.fromX + (j.toX - j.fromX) * k;
      p.arc = 4 * j.height * k * (1 - k);   // 抛物线高度
      p.rot = k * Math.PI * 2;              // 空中翻一圈
      if (k >= 1) onLand();
    }

    if (G.state === 'over') {
      p.fallV += 2400 * dt;
      p.fall  += p.fallV * dt;
      p.rot   += dt * 4;
    }

    G.camX += (G.camTargetX - G.camX) * (1 - Math.exp(-CAM_SPEED * dt));
  }

  /* ===================== 4. 渲染 ===================== */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawBoxes() {
    var bodyH = viewH - groundY + 80;   // 向下延伸出屏幕
    for (var i = 0; i < G.boxes.length; i++) {
      var b = G.boxes[i], sx = b.x - G.camX;
      if (sx > viewW + 20 || sx + b.w < -20) continue;
      ctx.fillStyle = b.color;
      roundRect(sx, groundY, b.w, bodyH, 10);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';   // 顶面提亮，制造 2.5D
      roundRect(sx, groundY, b.w, 11, 6);
      ctx.fill();
    }
  }

  function drawPlayer() {
    var p = G.player;
    var sx = p.x - G.camX;
    var sy = groundY - p.arc + p.fall;

    var shadow = Math.max(0, 1 - p.arc / 130 - p.fall / 200);   // 落点参考
    if (shadow > 0.02) {
      ctx.fillStyle = 'rgba(120,80,0,' + (0.22 * shadow) + ')';
      ctx.beginPath();
      ctx.ellipse(sx, groundY + 3, 15 * (0.6 + 0.4 * shadow), 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.translate(0, -PLAYER_H / 2); ctx.rotate(p.rot); ctx.translate(0, PLAYER_H / 2);  // 绕身体中部翻滚
    var fx = (p.face < 0 ? -1 : 1) * (ART_FACES_LEFT ? -1 : 1);                          // 朝跳跃方向（镜像）
    ctx.scale(fx * (1 + 0.22 * p.squash), 1 - 0.35 * p.squash);                          // 蓄力压扁

    if (spriteReady) {
      // 黄袋鼠 vs 黄背景只有 1.35:1 对比度，靠一圈 2px 暖色硬描边把轮廓"钉"出来（≈5.1:1）
      var rg = 2, dg = 1.5;   // 轴向 2px，对角 1.5px，避免圆角处出现缺口
      var dxs = [-rg, rg, 0, 0, -dg, dg, -dg, dg];
      var dys = [0, 0, -rg, rg, -dg, -dg, dg, dg];
      ctx.shadowColor = OUTLINE;
      ctx.shadowBlur = 0;
      for (var k = 0; k < 8; k++) {
        ctx.shadowOffsetX = dxs[k]; ctx.shadowOffsetY = dys[k];
        ctx.drawImage(sprite, 0, PLAYER_POSE * CELL, CELL, CELL,
                      -PLAYER_H / 2, -PLAYER_H, PLAYER_H, PLAYER_H);
      }
      ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      // 单帧 256x256，人物水平居中、底部对齐，所以整帧画成方形即可
      ctx.drawImage(sprite, 0, PLAYER_POSE * CELL, CELL, CELL,
                    -PLAYER_H / 2, -PLAYER_H, PLAYER_H, PLAYER_H);
    } else {                                                    // 素材没加载出来时的几何占位
      ctx.fillStyle = INK;
      roundRect(-9, -18, 18, 18, 6);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -24, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(74,58,0,0.55)';
    ctx.font = '12px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillText('SCORE', 24, 26);
    ctx.fillStyle = INK;
    ctx.font = 'bold 34px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillText(String(G.score), 22, 44);

    if (popup.t < 0.8) {                          // 完美居中飘字
      var k = popup.t / 0.8;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = '#e8590c';
      ctx.font = 'bold 20px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('完美 +' + PERFECT_BONUS, viewW / 2, groundY - 110 - k * 34);
      ctx.globalAlpha = 1;
    }

    if (G.state === 'charging') {                 // 蓄力条
      var bw = 160, bh = 8, bx = (viewW - bw) / 2, by = viewH - 64;
      ctx.fillStyle = 'rgba(74,58,0,0.16)';
      roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.fillStyle = '#e8590c';
      roundRect(bx, by, Math.max(bh, bw * G.power), bh, bh / 2); ctx.fill();
    }

    if (G.state === 'ready' && G.score === 0) {   // 新手提示
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(74,58,0,0.55)';
      ctx.font = '15px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('长按蓄力，松开起跳', viewW / 2, groundY - 84);
    }

    if (G.state === 'over') {
      ctx.fillStyle = 'rgba(74,58,0,0.28)';
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fffdf2';
      ctx.font = 'bold 24px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('游戏结束', viewW / 2, viewH * 0.34);
      ctx.font = 'bold 46px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText(String(G.score), viewW / 2, viewH * 0.43);
      ctx.fillStyle = 'rgba(255,253,242,0.9)';
      ctx.font = '14px system-ui,-apple-system,"PingFang SC",sans-serif';
      ctx.fillText('点击屏幕重新开始', viewW / 2, viewH * 0.52);
    }
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, viewH);
    g.addColorStop(0, BG_TOP);
    g.addColorStop(1, BG_BOT);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);
    drawBoxes();
    drawPlayer();
    drawHUD();
  }

  /* ===================== 5. 输入 ===================== */
  function onDown() {
    initAudio();                          // iOS 必须靠第一次手势解锁声音
    if (G.state === 'over') {
      if (time - G.overAt < 0.4) return;   // 防止失败瞬间误触重开
      reset(); return;
    }
    if (G.state === 'ready') {
      G.state = 'charging';
      G.chargeStart = time;
      G.power = 0;
      chargeHandle = playSfx('charge');    // 蓄力音：按下就播，松手淡出
    }
  }

  function onUp() {
    stopSfx(chargeHandle); chargeHandle = null;
    if (G.state !== 'charging') return;
    var pw = G.power;
    var dist = MIN_DIST + pw * (MAX_DIST - MIN_DIST);
    G.player.face = dist >= 0 ? 1 : -1;   // 脸朝跳跃方向
    G.jump = {
      fromX: G.player.x,
      toX: G.player.x + dist,
      t: 0,
      dur: 0.26 + pw * 0.34,
      height: 45 + pw * 75
    };
    G.player.squash = 0;
    G.state = 'jumping';
    playJump();
  }

  function onCancel() {
    stopSfx(chargeHandle); chargeHandle = null;
    if (G.state === 'charging') { G.state = 'ready'; G.power = 0; G.player.squash = 0; }
  }

  /* 静音开关：用 DOM 按钮，省掉画布上的点击命中判定 */
  var muteBtn = document.getElementById('mute');
  function syncMute() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.className = muted ? 'off' : '';
  }
  muteBtn.addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('jump_muted', muted ? '1' : '0'); } catch (err) {}
    syncMute();
  });
  syncMute();

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); onDown(); });
    window.addEventListener('pointerup',     function (e) { e.preventDefault(); onUp(); });
    window.addEventListener('pointercancel', function (e) { e.preventDefault(); onCancel(); });
  } else {
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); onDown(); }, { passive: false });
    window.addEventListener('touchend',   function (e) { e.preventDefault(); onUp(); },   { passive: false });
    window.addEventListener('touchcancel', function (e) { e.preventDefault(); onCancel(); }, { passive: false });
    canvas.addEventListener('mousedown',  function (e) { e.preventDefault(); onDown(); });
    window.addEventListener('mouseup', function () { onUp(); });
  }
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('blur', onCancel);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ===================== 6. 主循环 ===================== */
  function frame(ts) {
    if (!lastT) lastT = ts;
    var dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;
    time = ts / 1000;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  reset();
  resize();
  requestAnimationFrame(frame);
})();
</script>
